# Courier World multiplayer: a Worker in front of one Durable Object that holds the planet's room.
name = "courier-world-mp"
main = "src/index.js"
compatibility_date = "2025-10-01"

[[durable_objects.bindings]]
name = "PLANET"
class_name = "Planet"

[[durable_objects.bindings]]
name = "IMAGES"
class_name = "Images"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Planet"]

# Token pictures for the launchpad (only post office owners can upload; see padImage in src/index.js).
[[migrations]]
tag = "v2"
new_sqlite_classes = ["Images"]

# Courier Skins on Robinhood Chain: a player is shown in a skin only if this contract says they own it.
[vars]
SKINS_ADDRESS = "0x19716dAaDE3F2979aAA4f69cc04e2A5c00e7D23e"
# The post office: only wallets with one open can upload launchpad pictures.
POST_OFFICE = "0x26D80804D0FA2F4598369E0062bFC9536d115D82"
# The treasure hunt's payouts (TokenDrops): the room reads the running drops from it and signs vouchers for
# finds with DROPS_KEY (a secret, set with `npx wrangler secret put DROPS_KEY`; its address is the contract's signer).
DROPS_ADDRESS = "0xD0e785276840F7175DF12678991605042e89771C"
# The partner drops (a second TokenDrops, for tokens that aren't the Launchpad's, such as $MINE): signed for with the
# same DROPS_KEY; its drops are numbered from 1000 and have their own block of spots (web/drop-pick.js).
DROPS2_ADDRESS = "0x35E75cbE2EACb407D2dEB068AF0665E7858BE75F"
# Courier Companions (contracts/src/CourierCompanions.sol, an ERC-1155 bought with $STAMP): a player's companion is
# shown to the others only if this contract says the wallet on their name tag owns one of that kind.
COMPANIONS_ADDRESS = "0x4254cEac6B7C9F8911Ce908A910DD1874C5B49B7"
# Courier Fish (contracts/src/CourierFish.sol, an ERC-1155): the room checks each catch in the bay and signs vouchers
# with FISH_KEY (a secret, set with `npx wrangler secret put FISH_KEY`; its address is the contract's signer).
FISH_ADDRESS = "0xacF37fE6FdB848a4182d5A3646C2C0Ec11E09c90"
