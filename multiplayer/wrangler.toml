# Courier World multiplayer: a Worker in front of one Durable Object that holds the planet's room.
name = "courier-world-mp"
main = "src/index.js"
compatibility_date = "2025-10-01"

[[durable_objects.bindings]]
name = "PLANET"
class_name = "Planet"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Planet"]

# Courier Skins on Robinhood Chain: a player is shown in a skin only if this contract says they own it.
[vars]
SKINS_ADDRESS = "0x19716dAaDE3F2979aAA4f69cc04e2A5c00e7D23e"
